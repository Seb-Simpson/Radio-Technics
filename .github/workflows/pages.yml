# Publishes Radio Technics as a static site on GitHub Pages.
#
# Runs on every push to main (and on demand from the Actions tab). Builds the
# app as plain files (npm run build:pages) and deploys them with GitHub's
# official Pages actions. Before the first run, the repository owner must set
# Settings → Pages → Source to "GitHub Actions" (see docs/PUBLISHING.md).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same checks as every change: types, unit tests and content validation.
      - run: npm run typecheck
      - run: npm test
      - name: Build the static site
        run: npm run build:pages
        env:
          RT_STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          # Project sites are served at https://<owner>.github.io/<repository>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
